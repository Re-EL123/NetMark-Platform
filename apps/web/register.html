<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your NetMark Platform account to shop, manage a store, distribute or deliver.">
  <meta name="theme-color" content="#e50914">
  <title>NetMark Platform - Register</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon-180.png">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="container login-bg">
    <div class="login-card login-animate">
      <img src="/netmark-logo.png" alt="NetMark" class="brand-logo">
      <h1>NetMark Platform</h1>
      <p class="subtitle">Create an account</p>
      <div id="error" class="error" role="alert" aria-live="polite" style="display:none"></div>
      <form id="registerForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" inputmode="email" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6">
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
          </div>
        </div>
        <div class="form-group">
          <label for="role">Role</label>
          <select id="role" name="role">
            <option value="customer">Customer</option>
            <option value="storeOwner">Store Owner</option>
            <option value="driver">Driver</option>
            <option value="owner">Company Owner</option>
          </select>
        </div>
        <div class="form-group" id="codeGroup" style="display:none">
          <label for="distributorCode">Referral Code</label>
          <input type="text" id="distributorCode" name="distributorCode" autocomplete="off" placeholder="Optional referral code">
        </div>
        <button type="submit" class="btn">Register</button>
      </form>
      <p class="footer">Already have an account? <a href="/">Sign In</a></p>
      <p class="footer-links"><a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a> · <a href="/faq.html">FAQ</a> · <a href="/support.html">Support</a> · <a href="/feedback.html">Feedback</a></p>
    </div>
  </div>
  <script type="module" src="/src/register.ts"></script>
</body>
</html>
