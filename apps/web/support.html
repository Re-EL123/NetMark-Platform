<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetMark - Support</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="container" style="align-items:flex-start;padding-top:40px;padding-bottom:40px">
    <div class="login-card" style="max-width:900px">
      <img src="/netmark-logo.png" alt="NetMark" class="brand-logo">
      <h1 style="text-align:left">Support</h1>
      <p class="subtitle" style="text-align:left;margin-bottom:24px">Get help with your account or orders</p>
      <form action="https://formsubmit.co/support@re-el.co.za" method="POST">
        <input type="hidden" name="_subject" value="NetMark Support Request">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="account">Account</option>
            <option value="orders">Orders</option>
            <option value="commissions">Commissions</option>
            <option value="withdrawals">Withdrawals</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text-primary);font-family:inherit" required></textarea>
        </div>
        <button type="submit" class="btn">Send Request</button>
      </form>
      <p class="footer"><a href="/login.html">Back to Login</a> · <a href="/faq.html">FAQ</a></p>
    </div>
  </div>
</body>
</html>
