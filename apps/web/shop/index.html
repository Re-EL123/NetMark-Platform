<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetMark - Shop</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon-180.png">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="/netmark-logo.png" alt="NetMark">
      </div>
      <nav>
        <a href="/shop/" class="active">Shop</a>
      </nav>
    </aside>
    <div class="main">
      <header>
        <h1>Customer Shop</h1>
        <div class="user-meta">
          <span id="userName" class="name"></span>
          <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
      </header>
      <div class="content">
        <div class="card">
          <h2>Welcome to NetMark</h2>
          <p>Browse products, shops, place orders, manage appointments.</p>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/shop.guard.ts"></script>
  <script type="module" src="/src/shop.ts"></script>
</body>
</html>
