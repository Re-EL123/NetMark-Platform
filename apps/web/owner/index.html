<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetMark - Owner (Company Admin)</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon-180.png">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="/netmark-logo.png" alt="NetMark">
      </div>
      <nav>
        <a href="/owner/" class="active">Dashboard</a>
        <a href="#users">Users</a>
        <a href="#stores">Stores</a>
      </nav>
    </aside>
    <div class="main">
      <header>
        <h1>Owner (Company Admin)</h1>
        <div class="user-meta">
          <span id="userName" class="name"></span>
          <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
      </header>
      <div class="content">
        <div class="card">
          <h2>Company Management</h2>
          <p>Manage your own company: users, stores, products, orders, drivers, appointments, distributor codes.</p>
        </div>
        <div class="card">
          <h3>Company</h3>
          <div id="company"></div>
        </div>
        <div class="card">
          <h3>Users in Company</h3>
          <div id="users"></div>
        </div>
        <div class="card">
          <h3>Stores</h3>
          <div id="stores"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/owner.guard.ts"></script>
  <script type="module" src="/src/owner.ts"></script>
</body>
</html>
