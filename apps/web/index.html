<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetMark Platform - Login</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon-180.png">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="container">
    <div class="login-card">
      <img src="/netmark-logo.png" alt="NetMark" class="brand-logo">
      <h1>NetMark Platform</h1>
      <p class="subtitle">Sign in to continue</p>
      <div id="error" class="error" style="display:none"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn">Sign In</button>
      </form>
      <p class="footer">Don't have an account? <a href="/register.html">Register</a></p>
    </div>
  </div>
  <script type="module" src="/src/login.ts"></script>
</body>
</html>
