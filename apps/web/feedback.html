<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetMark - Feedback</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="container" style="align-items:flex-start;padding-top:40px;padding-bottom:40px">
    <div class="login-card" style="max-width:900px">
      <img src="/netmark-logo.png" alt="NetMark" class="brand-logo">
      <h1 style="text-align:left">Feedback</h1>
      <p class="subtitle" style="text-align:left;margin-bottom:24px">We'd love to hear your suggestions</p>
      <form action="https://formsubmit.co/feedback@re-el.co.za" method="POST">
        <input type="hidden" name="_subject" value="NetMark Feedback">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email">
        </div>
        <div class="form-group">
          <label for="rating">Rating</label>
          <select id="rating" name="rating">
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Good</option>
            <option value="3">3 - Average</option>
            <option value="2">2 - Poor</option>
            <option value="1">1 - Very Poor</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message">Feedback</label>
          <textarea id="message" name="message" rows="6" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text-primary);font-family:inherit" required></textarea>
        </div>
        <button type="submit" class="btn">Send Feedback</button>
      </form>
      <p class="footer"><a href="/">Back to Login</a></p>
    </div>
  </div>
</body>
</html>
