<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to NetMark — shop, sell, run a company or deliver. Sign in to continue.">
  <meta name="theme-color" content="#e50914">
  <title>NetMark — Sign in</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon-180.png">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="stylesheet" href="/src/signup.css">
</head>
<body>
  <div class="auth-stage">
    <video class="auth-video" src="/media/auth-bg.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
    <div class="auth-scrim" aria-hidden="true"></div>

    <div class="auth-panel">
      <a class="auth-back" href="/">← NetMark</a>
      <div class="login-card login-animate">
        <img src="/netmark-logo.png" alt="NetMark" class="brand-logo">
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to continue</p>
        <div id="error" class="error" role="alert" aria-live="polite" style="display:none"></div>
        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" inputmode="email" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Your password">
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
            </div>
          </div>
          <button type="submit" class="btn">Sign In</button>
        </form>
        <p class="footer">Don't have an account? <a href="/register.html">Create one</a></p>
        <p class="footer-links"><a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a> · <a href="/faq.html">FAQ</a> · <a href="/support.html">Support</a></p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/login.ts"></script>
</body>
</html>
