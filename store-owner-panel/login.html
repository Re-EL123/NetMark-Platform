<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Owner Login - NetMark</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #1A0A0D;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        .login-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .login-bg-logo {
            position: absolute;
            opacity: 0.14;
            will-change: transform;
        }

        .login-bg-logo-1 {
            width: min(42vw, 360px);
            top: 8%;
            left: 6%;
            animation: logoFloat 18s ease-in-out infinite;
        }

        .login-bg-logo-2 {
            width: min(52vw, 460px);
            top: 38%;
            right: 4%;
            animation: logoDrift 24s ease-in-out infinite;
            animation-delay: -6s;
        }

        .login-bg-logo-3 {
            width: min(34vw, 300px);
            bottom: 6%;
            left: 28%;
            animation: logoPulse 16s ease-in-out infinite;
            animation-delay: -10s;
        }

        .login-bg-logo-4 {
            width: min(60vw, 520px);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.08;
            animation: logoSpin 40s linear infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            50% { transform: translate(24px, -28px) rotate(8deg) scale(1.06); }
        }

        @keyframes logoDrift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-30px, 18px) rotate(-6deg); }
            66% { transform: translate(18px, -22px) rotate(5deg); }
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.12; }
            50% { transform: scale(1.14) rotate(-10deg); opacity: 0.2; }
        }

        @keyframes logoSpin {
            from { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            to { transform: translate(-50%, -50%) rotate(360deg) scale(1.08); }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-bg-logo {
                animation: none;
            }
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
            margin: 0;
        }

        .brand-logo {
            display: block;
            max-width: 160px;
            width: 100%;
            height: auto;
            margin: 0 auto 16px;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .form-actions {
            margin-top: 20px;
        }

        .form-actions button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-bg" aria-hidden="true">
        <img src="img/netmark-logo.png" alt="" class="login-bg-logo login-bg-logo-1">
        <img src="img/netmark-logo.png" alt="" class="login-bg-logo login-bg-logo-2">
        <img src="img/netmark-logo.png" alt="" class="login-bg-logo login-bg-logo-3">
        <img src="img/netmark-logo.png" alt="" class="login-bg-logo login-bg-logo-4">
    </div>

    <div class="login-container">
        <div class="login-header">
            <img src="img/netmark-logo.png" alt="NetMark" class="brand-logo">
            <p>Store Owner Portal</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    Login
                </button>
            </div>
        </form>

        <div class="footer-text">
            Need an account? <a href="register.html" style="color: #D7263D; text-decoration: none; font-weight: 600;">Register here</a>
            <br><br>
            © 2026 NetMark. All rights reserved.
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/api.js"></script>

    <script src="https://unpkg.com/feather-icons"></script>
    <script>feather.replace()</script>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const token = await user.getIdToken();
                    const response = await fetch(`${API_CONFIG.baseURL}/auth/me`, {
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    const data = await response.json();

                    if (data.success && data.data.user.role === 'storeOwner') {
                        window.location.href = 'index.html';
                    } else {
                        await auth.signOut();
                        showError('Access denied. Store Owner role required.');
                    }
                } catch (error) {
                    console.error('Auth check error:', error);
                }
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError('Please enter email and password');
                return;
            }

            try {
                loginBtn.disabled = true;
                loginBtn.textContent = 'Logging in...';
                hideError();

                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                const token = await user.getIdToken();
                const response = await fetch(`${API_CONFIG.baseURL}/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.message || 'Failed to load user profile');
                }

                if (data.data.user.role !== 'storeOwner') {
                    await auth.signOut();
                    throw new Error('Access denied. Store Owner role required.');
                }

                window.location.href = 'index.html';
            } catch (error) {
                console.error('Login error:', error);
                showError(error.message || 'Invalid email or password');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }
    </script>
</body>
</html>
